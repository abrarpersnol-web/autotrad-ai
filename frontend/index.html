<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ai Trade - Automated Crypto Trading Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 500: '#10B981', dark: '#0F172A' } } } }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="bg-emerald-500 text-slate-950 p-2 rounded-xl font-black text-xl">AI</div>
      <span class="text-xl font-bold tracking-tight">Ai Trade</span>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="openModal('depositModal')" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm transition">+ Deposit</button>
      <button onclick="openModal('withdrawModal')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold px-4 py-2 rounded-lg text-sm transition">Withdraw</button>
    </div>
  </nav>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
        <p class="text-xs text-slate-400 uppercase">Total Portfolio</p>
        <p class="text-2xl font-bold text-white mt-1">$1,245.80</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
        <p class="text-xs text-slate-400 uppercase">AI Status</p>
        <p class="text-xl font-semibold text-emerald-400 mt-1">Executing Trades</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
        <p class="text-xs text-slate-400 uppercase">Total Profit</p>
        <p class="text-2xl font-bold text-emerald-400 mt-1">+$245.80</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
        <p class="text-xs text-slate-400 uppercase">Min Deposit</p>
        <p class="text-2xl font-bold text-slate-200 mt-1">$1.00 USD</p>
      </div>
    </div>
  </main>

  <!-- DEPOSIT MODAL -->
  <div id="depositModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h3 class="text-lg font-bold text-white">Deposit Funds</h3>
        <button onclick="closeModal('depositModal')" class="text-slate-400">&times;</button>
      </div>
      <form onsubmit="handleDeposit(event)" class="space-y-3">
        <input id="depositAmount" type="number" min="1" step="0.01" placeholder="Amount ($1.00 min)" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
        <input id="cardNumber" type="text" placeholder="Card Number" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
        <button type="submit" class="w-full bg-emerald-500 font-bold py-2.5 rounded-lg text-slate-950">Confirm Deposit</button>
      </form>
    </div>
  </div>

  <!-- WITHDRAW MODAL -->
  <div id="withdrawModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h3 class="text-lg font-bold text-white">Withdrawal (TON Wallet)</h3>
        <button onclick="closeModal('withdrawModal')" class="text-slate-400">&times;</button>
      </div>
      <form onsubmit="handleWithdraw(event)" class="space-y-3">
        <input id="tonAddress" type="text" placeholder="TON Address (EQ... or UQ...)" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
        <input id="withdrawAmount" type="number" min="1" step="0.01" placeholder="Amount ($)" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
        <button type="submit" class="w-full bg-slate-100 font-bold py-2.5 rounded-lg text-slate-900">Process Withdrawal</button>
      </form>
    </div>
  </div>

  <script>
    // Set this URL to your Render live backend link after deployment
    const API_BASE_URL = "https://YOUR-BACKEND.onrender.com";

    function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
    function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

    async function handleDeposit(e) {
      e.preventDefault();
      const response = await fetch(`${API_BASE_URL}/api/v1/deposit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: "user_1",
          amount: parseFloat(document.getElementById('depositAmount').value),
          card_number: document.getElementById('cardNumber').value
        })
      });
      const data = await response.json();
      alert(data.message || data.detail);
      closeModal('depositModal');
    }

    async function handleWithdraw(e) {
      e.preventDefault();
      const response = await fetch(`${API_BASE_URL}/api/v1/withdraw-ton`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: "user_1",
          amount: parseFloat(document.getElementById('withdrawAmount').value),
          ton_address: document.getElementById('tonAddress').value
        })
      });
      const data = await response.json();
      alert(data.message || data.detail);
      closeModal('withdrawModal');
    }
  </script>
</body>
</html>
