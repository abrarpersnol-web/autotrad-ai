<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autotrad AI - Web3 Deposit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 flex flex-col items-center">

  <header class="w-full max-w-md flex justify-between items-center py-4 mb-4">
    <div class="flex items-center space-x-2">
      <div class="bg-blue-600 font-bold px-3 py-1 rounded-lg text-lg">A</div>
      <span class="font-bold text-xl">Autotrad <span class="text-blue-500">AI</span></span>
    </div>
    <button id="connectBtn" onclick="connectWallet()" class="bg-blue-600 hover:bg-blue-500 font-semibold px-4 py-2 rounded-xl text-xs transition">
      Connect Wallet
    </button>
  </header>

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5">
    <div>
      <h1 class="text-2xl font-bold">Instant Web3 Deposit</h1>
      <p class="text-slate-400 text-sm">Pay directly from MetaMask or Trust Wallet</p>
    </div>

    <div id="walletStatus" class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex justify-between items-center text-xs">
      <span class="text-slate-400">Status:</span>
      <span id="statusText" class="text-amber-400 font-medium">Not Connected</span>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Deposit Amount (ETH / BNB)</label>
      <div class="flex items-center bg-slate-950 border border-slate-800 rounded-xl px-4 py-3">
        <input id="depositAmount" type="number" step="0.001" value="0.01" class="bg-transparent text-lg font-bold w-full text-white outline-none">
        <span class="text-blue-500 font-bold">ETH</span>
      </div>
    </div>

    <button id="payBtn" onclick="sendTransaction()" disabled class="w-full bg-slate-800 text-slate-500 font-bold py-3 rounded-xl cursor-not-allowed transition">
      Connect Wallet to Pay
    </button>
  </div>

  <script>
    const RECEIVER_ADDRESS = "0xYourEthereumOrBSCWalletAddressHere";
    let provider, signer, userAddress = "";

    async function connectWallet() {
      if (window.ethereum) {
        try {
          provider = new ethers.providers.Web3Provider(window.ethereum);
          await provider.send("eth_requestAccounts", []);
          signer = provider.getSigner();
          userAddress = await signer.getAddress();
          const shortAddr = userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
          
          document.getElementById('connectBtn').innerText = shortAddr;
          document.getElementById('connectBtn').className = "bg-emerald-600 text-white font-semibold px-4 py-2 rounded-xl text-xs";
          document.getElementById('statusText').innerText = "Connected";
          document.getElementById('statusText').className = "text-emerald-400 font-medium";

          const payBtn = document.getElementById('payBtn');
          payBtn.disabled = false;
          payBtn.innerText = "Send Deposit Now";
          payBtn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition cursor-pointer";
        } catch (error) {
          alert("Connection failed: " + error.message);
        }
      } else {
        alert("Please open this page inside Trust Wallet or MetaMask browser.");
      }
    }

    async function sendTransaction() {
      const amountInput = document.getElementById('depositAmount').value;
      if (!amountInput || parseFloat(amountInput) <= 0) return alert("Invalid amount");

      try {
        document.getElementById('payBtn').innerText = "Processing...";
        const tx = await signer.sendTransaction({
          to: RECEIVER_ADDRESS,
          value: ethers.utils.parseEther(amountInput.toString())
        });
        alert("Transaction Sent! Hash: " + tx.hash);
        await tx.wait();
        alert("Deposit Confirmed!");
      } catch (err) {
        alert("Transaction Failed: " + err.message);
      } finally {
        document.getElementById('payBtn').innerText = "Send Deposit Now";
      }
    }
  </script>
</body>
</html>
